name: Windows progressive playback decoder
on:
  push:
    branches: [codex/windows-native-client]
    paths:
      - '.github/workflows/windows-progressive-playback.yml'
      - 'clients/windows/tests/Fileway.ProgressivePlaybackHarness/**'
      - 'clients/windows/eng/*ProgressivePlayback*'
      - 'clients/windows/eng/tests/test_progressive_playback*'
      - 'clients/windows/src/Fileway.Playback/**'
      - 'clients/windows/src/Fileway.Infrastructure/Transfers/FileDownloadRunner*'
      - 'clients/windows/src/Fileway.Infrastructure/Transfers/WindowsDownloadFileAccess.cs'
      - 'clients/windows/src/Fileway.Core/Integration/Download*'
      - 'clients/windows/vendor/mpv/runtime-packages.lock.json'
      - 'clients/windows/vendor/mpv/resolve-runtime.py'
      - 'clients/windows/vendor/mpv/requirements-restore.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progressive-decoder:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: clients/windows
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Configure isolated paths
        run: |
          @(
            "FILEWAY_TOOLS_ROOT=$env:RUNNER_TEMP\Fileway-progressive-tools"
            "FILEWAY_ARTIFACTS_ROOT=$env:RUNNER_TEMP\Fileway-progressive-artifacts"
            "FILEWAY_NUGET_PACKAGES=$env:RUNNER_TEMP\Fileway-progressive-nuget"
            "FILEWAY_PROGRESSIVE_FIXTURE=$env:RUNNER_TEMP\Fileway-progressive-fixture\sample.y4m"
            "FILEWAY_PROGRESSIVE_EVIDENCE=$env:RUNNER_TEMP\Fileway-progressive-evidence"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Install pinned isolated toolchains
        run: ./eng/Install-WindowsTools.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT
      - name: Check progressive harness contracts
        run: |
          python -m unittest discover -s eng/tests -p 'test_progressive_playback*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Progressive harness contract checks failed.' }
      - name: Install hash-locked runtime inspection
        run: |
          python -m venv "$env:FILEWAY_TOOLS_ROOT\mpv-python"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create isolated Python environment.' }
          & "$env:FILEWAY_TOOLS_ROOT\mpv-python\Scripts\python.exe" -m pip install --require-hashes --only-binary=:all: --no-deps -r vendor/mpv/requirements-restore.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked runtime inspection installation failed.' }
      - name: Restore exact committed media runtime
        run: |
          & "$env:FILEWAY_TOOLS_ROOT\mpv-python\Scripts\python.exe" vendor/mpv/resolve-runtime.py --artifacts-root $env:FILEWAY_ARTIFACTS_ROOT --lock-input vendor/mpv/runtime-packages.lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime restore failed.' }
          & "$env:FILEWAY_TOOLS_ROOT\mpv-python\Scripts\python.exe" vendor/mpv/probe-runtime.py "$env:FILEWAY_ARTIFACTS_ROOT\media-runtime\x64"
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime probe failed.' }
      - name: Build isolated native decoder harness
        run: |
          . ./eng/Use-WindowsEnvironment.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES
          dotnet build tests/Fileway.ProgressivePlaybackHarness/Fileway.ProgressivePlaybackHarness.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Progressive harness build failed.' }
      - name: Generate deterministic front-header video
        run: |
          python eng/New-ProgressivePlaybackFixture.py --output $env:FILEWAY_PROGRESSIVE_FIXTURE
          if ($LASTEXITCODE -ne 0) { throw 'Progressive fixture generation failed.' }
      - name: Verify real native prefix decoding and reader lifetime
        run: |
          . ./eng/Use-WindowsEnvironment.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES
          $target = (& dotnet msbuild tests/Fileway.ProgressivePlaybackHarness/Fileway.ProgressivePlaybackHarness.csproj -getProperty:TargetDir -p:Configuration=Release -p:Platform=x64 -nologo).Trim()
          if ($LASTEXITCODE -ne 0 -or -not [IO.Path]::IsPathFullyQualified($target)) { throw 'Cannot locate progressive harness.' }
          ./eng/Test-ProgressivePlayback.ps1 -HarnessPath (Join-Path $target 'Fileway.ProgressivePlaybackHarness.exe') -RuntimeDirectory "$env:FILEWAY_ARTIFACTS_ROOT\media-runtime\x64" -RuntimeLockPath (Join-Path $PWD 'vendor/mpv/runtime-packages.lock.json') -FixturePath $env:FILEWAY_PROGRESSIVE_FIXTURE -OutputRoot $env:FILEWAY_PROGRESSIVE_EVIDENCE
      - name: Preserve fixed synthetic decoder evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-progressive-decoder-evidence
          path: |
            ${{ runner.temp }}/Fileway-progressive-evidence/report.json
            ${{ runner.temp }}/Fileway-progressive-evidence/events.jsonl
          if-no-files-found: ignore
