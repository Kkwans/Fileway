name: Go transport
on:
  push:
    branches: [main]
    paths: ['clients/shared/core/**', '.github/workflows/native-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: clients/shared/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache: false
      - name: Native core tests
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            CGO_ENABLED=0 go test ./transport ./bridge ./tailnet
            CGO_ENABLED=0 go vet ./transport ./bridge ./tailnet
          else
            go test -race ./...
            go vet ./...
          fi
      - name: Direct-only TV core contracts
        run: |
          CGO_ENABLED=0 go test -tags fileway_direct ./transport ./bridge
          CGO_ENABLED=0 go vet -tags fileway_direct ./transport ./bridge
          if go list -tags fileway_direct -deps ./bridge | grep -E '(^tailscale.com/|/core/tailnet$)'; then
            echo "Direct build unexpectedly contains an embedded network dependency"
            exit 1
          fi
