name: Windows player shutdown diagnostics
on:
  push:
    branches: [codex/windows-native-client]
    paths:
      - '.github/workflows/windows-player-shutdown-diagnostics.yml'
      - 'clients/windows/eng/Test-PlayerSmoke.ps1'
      - 'clients/windows/eng/New-PlayerSmokeFixture.py'
      - 'clients/windows/eng/tests/test_player_smoke_harness_contract.py'
      - 'clients/windows/eng/Install-WindowsTools.ps1'
      - 'clients/windows/eng/Use-WindowsEnvironment.ps1'
      - 'clients/windows/eng/Build-Windows.ps1'
      - 'clients/windows/vendor/mpv/runtime-packages.lock.json'
      - 'clients/windows/vendor/mpv/resolve-runtime.py'
      - 'clients/windows/vendor/mpv/requirements-restore.txt'
      - 'clients/windows/src/Fileway.App/App.xaml.cs'
      - 'clients/windows/src/Fileway.App/MainWindow.xaml.cs'
      - 'clients/windows/src/Fileway.Playback/**'
      - 'clients/windows/src/Fileway.App/MediaSurfaces/**'
      - 'clients/windows/src/Fileway.App/Controls/Playback/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shutdown-diagnostics:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: clients/windows
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Configure isolated paths
        run: |
          @(
            "FILEWAY_TOOLS_ROOT=$env:RUNNER_TEMP\Fileway-shutdown-tools"
            "FILEWAY_ARTIFACTS_ROOT=$env:RUNNER_TEMP\Fileway-shutdown-artifacts"
            "FILEWAY_NUGET_PACKAGES=$env:RUNNER_TEMP\Fileway-shutdown-nuget"
            "FILEWAY_SMOKE_EVIDENCE=$env:RUNNER_TEMP\Fileway-shutdown-preflight"
            "FILEWAY_SMOKE_MEDIA=$env:RUNNER_TEMP\Fileway-shutdown-fixture\sample.avi"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Parse player smoke script before provisioning
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'eng/Test-PlayerSmoke.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Player smoke PowerShell syntax validation failed.'
          }
      - name: Install pinned isolated toolchains
        run: ./eng/Install-WindowsTools.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT
      - name: Execute production evidence readers and Windows sharing regression
        run: |
          . ./eng/Use-WindowsEnvironment.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES
          $env:FILEWAY_SMOKE_DOTNET = (Get-Command dotnet).Source
          python -m unittest discover -s eng/tests -p test_player_smoke_harness_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Player smoke production evidence reader regression failed.' }
      - name: Check interactive desktop and capture before media downloads
        run: ./eng/Test-PlayerSmoke.ps1 -CaptureShutdownStack -PreflightOnly -WinAppPath "$env:FILEWAY_TOOLS_ROOT\winapp-0.7.1\winapp.exe" -OutputRoot $env:FILEWAY_SMOKE_EVIDENCE
      - name: Install hash-locked PE inspection in private virtual environment
        run: |
          python -m venv "$env:FILEWAY_TOOLS_ROOT\mpv-python"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create isolated Python environment.' }
          & "$env:FILEWAY_TOOLS_ROOT\mpv-python\Scripts\python.exe" -m pip install --require-hashes --only-binary=:all: --no-deps -r vendor/mpv/requirements-restore.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked PE inspection installation failed.' }
      - name: Restore exact committed media runtime
        run: |
          & "$env:FILEWAY_TOOLS_ROOT\mpv-python\Scripts\python.exe" vendor/mpv/resolve-runtime.py --artifacts-root $env:FILEWAY_ARTIFACTS_ROOT --lock-input vendor/mpv/runtime-packages.lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Pinned media runtime restore failed.' }
          & "$env:FILEWAY_TOOLS_ROOT\mpv-python\Scripts\python.exe" vendor/mpv/probe-runtime.py "$env:FILEWAY_ARTIFACTS_ROOT\media-runtime\x64"
          if ($LASTEXITCODE -ne 0) { throw 'Native media runtime probe failed.' }
      - name: Build native application without publishing a package
        id: build
        run: ./eng/Build-Windows.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES -MediaRuntimeRoot "$env:FILEWAY_ARTIFACTS_ROOT\media-runtime\x64" -Configuration Release
      - name: Generate private deterministic video
        id: fixture
        run: |
          python eng/New-PlayerSmokeFixture.py --output $env:FILEWAY_SMOKE_MEDIA --duration-seconds 180
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic media generation failed.' }
      - name: A minimal playback then player and main close
        id: case_a
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixture.outcome == 'success' }}
        continue-on-error: true
        run: |
          . ./eng/Use-WindowsEnvironment.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES
          $target = (& dotnet msbuild src/Fileway.App/Fileway.App.csproj -getProperty:TargetDir -p:Configuration=Release -p:Platform=x64 -nologo).Trim()
          if ($LASTEXITCODE -ne 0 -or -not [IO.Path]::IsPathFullyQualified($target)) { throw 'Cannot locate the built native application.' }
          ./eng/Test-PlayerSmoke.ps1 -CaptureShutdownStack -ShutdownScenario MinimalPlayback -AppPath (Join-Path $target 'Fileway.App.exe') -MediaPath $env:FILEWAY_SMOKE_MEDIA -WinAppPath "$env:FILEWAY_TOOLS_ROOT\winapp-0.7.1\winapp.exe" -OutputRoot "$env:RUNNER_TEMP\Fileway-shutdown-diagnostics\A-minimal"
      - name: B full interactions then main close with player open
        id: case_b
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixture.outcome == 'success' }}
        continue-on-error: true
        run: |
          . ./eng/Use-WindowsEnvironment.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES
          $target = (& dotnet msbuild src/Fileway.App/Fileway.App.csproj -getProperty:TargetDir -p:Configuration=Release -p:Platform=x64 -nologo).Trim()
          if ($LASTEXITCODE -ne 0 -or -not [IO.Path]::IsPathFullyQualified($target)) { throw 'Cannot locate the built native application.' }
          ./eng/Test-PlayerSmoke.ps1 -CaptureShutdownStack -ShutdownScenario MainWithOpenPlayer -AppPath (Join-Path $target 'Fileway.App.exe') -MediaPath $env:FILEWAY_SMOKE_MEDIA -WinAppPath "$env:FILEWAY_TOOLS_ROOT\winapp-0.7.1\winapp.exe" -OutputRoot "$env:RUNNER_TEMP\Fileway-shutdown-diagnostics\B-open-player"
      - name: Require both diagnostic processes to exit normally
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixture.outcome == 'success' }}
        env:
          CASE_A_OUTCOME: ${{ steps.case_a.outcome }}
          CASE_B_OUTCOME: ${{ steps.case_b.outcome }}
        run: |
          if ($env:CASE_A_OUTCOME -ne 'success' -or $env:CASE_B_OUTCOME -ne 'success') { throw 'One or both bounded shutdown diagnostics did not pass their app/Host exit gates.' }
      - name: Preserve only allowlisted synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-player-shutdown-diagnostic-evidence
          path: |
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/A-minimal/report.json
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/A-minimal/events.jsonl
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/A-minimal/player-responsiveness.json
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/A-minimal/screenshots/*.png
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/B-open-player/report.json
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/B-open-player/events.jsonl
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/B-open-player/player-responsiveness.json
            ${{ runner.temp }}/Fileway-shutdown-diagnostics/B-open-player/screenshots/*.png
          if-no-files-found: ignore
