name: Android
on:
  push:
    branches: [main]
    paths: ['clients/android/**', 'clients/shared/core/**', 'clients/shared/android/client-core/**', 'clients/shared/android/media-core/**', 'clients/shared/android/design-foundation/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      test_methods:
        description: 'Optional affected-method batch: canonical package.Class#method entries separated by commas; empty runs the full suite'
        required: false
        type: string
        default: ''
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  media-native:
    uses: ./.github/workflows/media-ffmpeg-probe.yml
  build:
    needs: media-native
    env:
      ORG_GRADLE_PROJECT_filewayFfmpegManifest: ${{ github.workspace }}/media-native/ffmpeg-probe.json
      NFB_TEST_METHODS: ${{ inputs.test_methods || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '35'
            target: google_apis
          - api: '37.0'
            target: google_apis_ps16k
    defaults:
      run:
        working-directory: clients/android
    runs-on: ubuntu-24.04
    # Allow SDK/build, the 30-minute full suite, restart gates and evidence export.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media3-ffmpeg-probe-${{ github.sha }}
          path: media-native
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache: false
      - name: Check emulator script contract
        run: |
          python3 scripts/check-emulator-script.py
          python3 -m unittest discover -s scripts/tests -p test_emulator_checks.py -v
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/nfb-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 2 'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' -o "$RUNNER_TEMP/sdk-tools.zip"
          echo 'e025545c62a8e64c7559119566a569fb1dec5f60  '"$RUNNER_TEMP/sdk-tools.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/sdk-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          test "$SDK_STATUS" = 0
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Build native transport
        run: bash scripts/build-native.sh
      - name: Build and check
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --stacktrace
      - name: Upload installable preview candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: android-preview-candidate-api${{ matrix.api }}
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Allow KVM in ephemeral runner
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Native runtime and UI smoke (emulator only)
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell getconf PAGESIZE
            if [ '${{ matrix.target }}' = google_apis_ps16k ]; then test "$(adb shell getconf PAGESIZE | tr -d '\r')" = 16384; fi
            mkdir -p clients/android/app/build/acceptance
            cd clients/android; python3 scripts/run-emulator-checks.py --serial "$(adb get-serialno)" --test-methods "$NFB_TEST_METHODS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-checkpoint-api${{ matrix.api }}
          path: |
            clients/android/app/build/outputs/apk/debug/*.apk
            clients/android/app/build/reports/
            clients/android/app/build/acceptance/
            clients/android/app/build/outputs/androidTest-results/
