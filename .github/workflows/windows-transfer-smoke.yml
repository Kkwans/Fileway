name: Windows transfer interaction smoke
on:
  push:
    branches: [codex/windows-native-client]
    paths:
      - '.github/workflows/windows-transfer-smoke.yml'
      - 'clients/windows/eng/Test-PlayerSmoke.ps1'
      - 'clients/windows/eng/Test-TransferSmoke.ps1'
      - 'clients/windows/eng/tests/test_transfer_smoke_harness_contract.py'
      - 'clients/windows/src/Fileway.App/App.xaml.cs'
      - 'clients/windows/src/Fileway.App/MainWindow.xaml.cs'
      - 'clients/windows/src/Fileway.App/MainPage.Downloads.cs'
      - 'clients/windows/src/Fileway.App/MainPage.FileCommands.cs'
      - 'clients/windows/src/Fileway.App/DownloadPresentationPolicy.cs'
      - 'clients/windows/src/Fileway.Core/Contracts/Downloads.cs'
      - 'clients/windows/src/Fileway.App/MainPage.Uploads.cs'
      - 'clients/windows/src/Fileway.Infrastructure/Services/UploadApplicationService*'
      - 'clients/windows/src/Fileway.Infrastructure/Transfers/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-transfers:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: clients/windows
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Configure isolated paths
        run: |
          @(
            "FILEWAY_TOOLS_ROOT=$env:RUNNER_TEMP\Fileway-transfer-tools"
            "FILEWAY_ARTIFACTS_ROOT=$env:RUNNER_TEMP\Fileway-transfer-artifacts"
            "FILEWAY_NUGET_PACKAGES=$env:RUNNER_TEMP\Fileway-transfer-nuget"
            "FILEWAY_SMOKE_EVIDENCE=$env:RUNNER_TEMP\Fileway-transfer-evidence"
            "FILEWAY_TRANSFER_SERVER=$env:RUNNER_TEMP\Fileway-transfer-artifacts\transfer-server\fileway-server.exe"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Validate transfer smoke before provisioning
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'eng/Test-TransferSmoke.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Transfer smoke PowerShell syntax validation failed.'
          }
          python -m unittest discover -s eng/tests -p test_transfer_smoke_harness_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Transfer smoke offline guards failed.' }
      - name: Install pinned isolated toolchains
        run: ./eng/Install-WindowsTools.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT
      - name: Check interactive desktop and capture before application build
        run: ./eng/Test-TransferSmoke.ps1 -PreflightOnly -WinAppPath "$env:FILEWAY_TOOLS_ROOT\winapp-0.7.1\winapp.exe" -OutputRoot $env:FILEWAY_SMOKE_EVIDENCE
      - name: Build native application without publishing a package
        run: ./eng/Build-Windows.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES -Configuration Release
      - name: Build real loopback transfer server
        run: |
          . ./eng/Use-WindowsEnvironment.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES
          New-Item -ItemType Directory -Path (Split-Path $env:FILEWAY_TRANSFER_SERVER) -Force | Out-Null
          Push-Location ../../server/backend
          try {
            & go build -o $env:FILEWAY_TRANSFER_SERVER .
            if ($LASTEXITCODE -ne 0) { throw 'Real transfer server build failed.' }
          } finally { Pop-Location }
      - name: Verify real native upload and download journey
        run: |
          . ./eng/Use-WindowsEnvironment.ps1 -ToolsRoot $env:FILEWAY_TOOLS_ROOT -ArtifactsRoot $env:FILEWAY_ARTIFACTS_ROOT -NuGetPackagesRoot $env:FILEWAY_NUGET_PACKAGES
          $target = (& dotnet msbuild src/Fileway.App/Fileway.App.csproj -getProperty:TargetDir -p:Configuration=Release -p:Platform=x64 -nologo).Trim()
          if ($LASTEXITCODE -ne 0 -or -not [IO.Path]::IsPathFullyQualified($target)) { throw 'Cannot locate the built native application.' }
          ./eng/Test-TransferSmoke.ps1 -AppPath (Join-Path $target 'Fileway.App.exe') -ServerPath $env:FILEWAY_TRANSFER_SERVER -WinAppPath "$env:FILEWAY_TOOLS_ROOT\winapp-0.7.1\winapp.exe" -OutputRoot $env:FILEWAY_SMOKE_EVIDENCE
      - name: Preserve only allowlisted synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-transfer-interaction-evidence
          path: |
            ${{ runner.temp }}/Fileway-transfer-evidence/report.json
            ${{ runner.temp }}/Fileway-transfer-evidence/events.jsonl
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/preflight.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/preflight-smoke.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/upload-confirm.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/upload-completed.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/download-confirm.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/download-completed.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/download-conflict.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/upload-conflict.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/connect-failure.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/connect-ready.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/transfer-center-uploads.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/transfer-center-downloads.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/upload-result-failure.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/download-save-as-confirm.png
            ${{ runner.temp }}/Fileway-transfer-evidence/screenshots/download-save-as-completed.png
          if-no-files-found: ignore
